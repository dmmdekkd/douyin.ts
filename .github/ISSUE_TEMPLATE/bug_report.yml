name: Bug 报告
description: 报告可复现的 SDK 缺陷；使用咨询请前往 Discussions
title: 'Bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        ## 提交前请先花一分钟确认
        Issue 用于跟踪**可复现、可定位的 SDK 缺陷**。安装咨询、登录风控、失效接口等问题，请先查阅[项目文档](https://github.com/dmmdekkd/douyin.ts)并前往 [Discussions](https://github.com/dmmdekkd/douyin.ts/discussions) 交流。
        > [!IMPORTANT]
        > 请把"发生了什么、如何复现、完整日志、运行环境"一次写清。仅填写"如题""如图""报错了"，或使用 `*`、`test` 等内容占位，会被自动标记为 `needs-info`。
        > [!CAUTION]
        > 日志、截图和配置必须先脱敏。请勿提交 Cookie、Token、账号凭证或其他隐私信息。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      description: 以下项目全部完成后再提交；勾选不代表可以省略下方证据。
      options:
        - label: '我已查阅项目文档，并确认这不是文档已有答案的使用问题 <!-- douyin-issue-form: bug-v2 -->'
          required: true
        - label: 我已搜索现有 Issues 和 Discussions，确认没有相同问题
          required: true
        - label: 我已更新到当前最新稳定版，并在更新后重新复现
          required: true
        - label: 我确认下方日志、截图和配置均已移除敏感信息（Cookie、Token、凭证）
          required: true
        - label: 我理解信息不足的 Issue 会被标记，超过 7 天仍未补充可能被自动关闭
          required: true
  - type: dropdown
    id: problem-type
    attributes:
      label: 问题类型
      description: 选择最接近的类型，便于快速分流。
      options:
        - 登录、扫码或 MFA 二次验证
        - 消息收发（文本 / 媒体 / 合并转发 / 撤回 / 回应）
        - 收件箱与联系人（好友 / 群 / 历史 / 申请）
        - 媒体上传
        - 签名与协议（bogus / frontier 等）
        - 安装、构建或类型检查
        - 其他或暂不确定
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 涉及平台
      description: 选择问题直接涉及的平台。
      options:
        - 抖音 App
        - 网页端
        - 通用或不确定
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 说明问题出现的位置、触发条件、首次出现时间和影响；不要只重复标题或只贴截图。
      placeholder: |
        例如：登录后收到消息事件正常，但发送文本一直超时，扫码登录阶段无异常。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 提供最小、完整、可重复执行的代码或步骤；请给出脱敏后的最小样例。
      placeholder: |
        1. 使用以下代码创建 Bot：……（脱敏后的最小样例）
        2. 调用 …… 
        3. 观察到 ……
    validations:
      required: true
  - type: textarea
    id: actual-result
    attributes:
      label: 实际结果与完整日志
      description: 粘贴错误发生前后的完整文本日志，或上传能说明问题的截图/日志文件。请勿只提供被裁掉上下文的报错截图。
      placeholder: |
        请粘贴日志或拖入截图/日志文件，并标出问题发生的时间点。没有异常堆栈时，也请写明实际发生了什么。
    validations:
      required: true
  - type: textarea
    id: expected-result
    attributes:
      label: 预期行为
      description: 说明你认为正确的输入、处理过程或输出是什么。
      placeholder: 例如：发送文本应正常送达并返回消息体，而不是超时报错。
    validations:
      required: true
  - type: textarea
    id: related-config
    attributes:
      label: 相关配置与调用代码
      description: 仅粘贴与问题有关的脱敏配置或调用代码。若确认与配置无关，请写明判断依据，不要填写 `无` 或 `*`。
      placeholder: |
        例如：
        - new Bot({ cookie, userId }) 的传参（Cookie 已脱敏）
        - bot.msg.send(chatId, { text: '...' })
        - 与配置无关：登录阶段即失败，未走到消息发送
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 请完整填写实际版本，不要写"最新版"或"默认"。
      value: |
        - SDK 版本：
        - Node.js 版本：
        - 操作系统：
        - 安装方式（npm / GitHub Packages / build 分支 / 预览包）：
        - 运行代码来源（demo / 自研项目）：
    validations:
      required: true
  - type: dropdown
    id: reproducibility
    attributes:
      label: 复现频率
      options:
        - 必现（每次都能复现）
        - 高频（多数情况下可复现）
        - 偶发（已复现多次但不稳定）
        - 仅出现一次
    validations:
      required: true
